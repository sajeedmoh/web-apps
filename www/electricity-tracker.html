<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Electricity Tracker</title>
  <script>if (!localStorage.getItem('auth_session')) window.location.replace('login.html');</script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:            #0f1117;
      --surface:       #1a1d27;
      --surface2:      #1f2330;
      --border:        rgba(255,255,255,0.08);
      --text:          #f0f0f0;
      --muted:         rgba(240,240,240,0.45);
      --accent:        #f59e0b;
      --accent-bg:     rgba(245,158,11,0.10);
      --accent-border: rgba(245,158,11,0.25);
      --green:         #22c55e;
      --green-bg:      rgba(34,197,94,0.10);
      --green-border:  rgba(34,197,94,0.25);
      --red:           #ef4444;
      --red-bg:        rgba(239,68,68,0.08);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 76px 24px 60px;
    }

    .back-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      background: rgba(15,17,23,0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      height: 44px;
    }

    .back-link {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.82rem;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.18s;
    }

    .back-link:hover { color: var(--accent); }

    .page-wrap {
      max-width: 700px;
      margin: 0 auto;
    }

    .page-header { margin-bottom: 20px; }

    .page-title {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 4px;
    }

    .page-subtitle {
      font-size: 0.85rem;
      color: var(--muted);
    }

    /* Consumer selector */
    .consumer-section { margin-bottom: 20px; }

    .consumer-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .consumer-tab {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 13px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
      color: var(--muted);
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 500;
      font-family: inherit;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
      user-select: none;
    }

    .consumer-tab:hover:not(.active) {
      border-color: rgba(255,255,255,0.15);
      color: var(--text);
    }

    .consumer-tab.active {
      border-color: var(--accent-border);
      background: var(--accent-bg);
      color: var(--accent);
    }

    .tab-actions {
      display: flex;
      gap: 1px;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .consumer-tab:hover .tab-actions,
    .consumer-tab.active .tab-actions {
      opacity: 1;
    }

    .tab-action-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: currentColor;
      opacity: 0.45;
      font-size: 0.72rem;
      padding: 1px 3px;
      line-height: 1;
      font-family: inherit;
      border-radius: 3px;
      transition: opacity 0.15s, background 0.15s;
    }

    .tab-action-btn:hover {
      opacity: 1;
      background: rgba(255,255,255,0.08);
    }

    .btn-add-consumer {
      padding: 8px 13px;
      border-radius: 9px;
      border: 1px dashed rgba(255,255,255,0.12);
      background: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.82rem;
      font-family: inherit;
      font-weight: 500;
      transition: border-color 0.15s, color 0.15s;
    }

    .btn-add-consumer:hover {
      border-color: var(--accent-border);
      color: var(--accent);
    }

    .add-consumer-panel {
      margin-top: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
    }

    .add-consumer-panel .form-grid { margin-bottom: 0; }

    .add-consumer-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .btn-save-consumer {
      padding: 9px 18px;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: #000;
      font-size: 0.84rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: filter 0.15s;
    }

    .btn-save-consumer:hover { filter: brightness(1.1); }
    .btn-save-consumer:disabled { opacity: 0.6; cursor: not-allowed; }

    .btn-cancel-consumer {
      padding: 9px 18px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-size: 0.84rem;
      font-family: inherit;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .btn-cancel-consumer:hover {
      border-color: rgba(255,255,255,0.2);
      color: var(--text);
    }

    /* Cycle summary bar */
    .cycle-bar {
      background: var(--accent-bg);
      border: 1px solid var(--accent-border);
      border-radius: 14px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }

    .cycle-bar-label {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 3px;
    }

    .cycle-bar-value {
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .cycle-bar-unit {
      font-size: 0.8rem;
      color: rgba(245,158,11,0.6);
      margin-left: 4px;
    }

    .cycle-bar-meta {
      font-size: 0.75rem;
      color: rgba(245,158,11,0.55);
      margin-top: 3px;
    }

    .cycle-bar-right { text-align: right; }

    .last-reading-label {
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 2px;
    }

    .last-reading-val {
      font-size: 1.1rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }

    /* Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 18px;
    }

    /* Form grid */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }

    .form-grid .span2 { grid-column: span 2; }

    .field label {
      display: block;
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 500;
    }

    .field input[type="text"],
    .field input[type="date"],
    .field input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text);
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
      appearance: textfield;
      -moz-appearance: textfield;
    }

    .field input::-webkit-outer-spin-button,
    .field input::-webkit-inner-spin-button { -webkit-appearance: none; }

    .field input:focus { border-color: var(--accent); }
    .field input::placeholder { color: rgba(240,240,240,0.2); }

    /* Usage preview */
    .usage-preview {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      font-size: 0.78rem;
      color: var(--muted);
      min-height: 1.4em;
    }

    .usage-preview .uval {
      font-weight: 700;
      color: var(--green);
    }

    /* Entry type selector */
    .type-group { display: flex; gap: 10px; }

    .type-option {
      flex: 1;
      position: relative;
    }

    .type-option input[type="radio"] {
      position: absolute;
      opacity: 0;
      width: 0; height: 0;
    }

    .type-option label {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 9px;
      cursor: pointer;
      font-size: 0.84rem;
      color: var(--muted);
      font-weight: 500;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
      user-select: none;
    }

    .type-option input[type="radio"]:checked + label {
      border-color: var(--accent-border);
      background: var(--accent-bg);
      color: var(--accent);
    }

    .type-option.bill input[type="radio"]:checked + label {
      border-color: var(--green-border);
      background: var(--green-bg);
      color: var(--green);
    }

    .type-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }

    /* Submit button */
    .btn-add {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      border: none;
      border-radius: 9px;
      color: #000;
      font-size: 0.92rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: filter 0.15s, transform 0.1s;
      margin-top: 4px;
    }

    .btn-add:hover { filter: brightness(1.1); }
    .btn-add:active { transform: scale(0.98); }

    /* Entries */
    .entries-section { margin-top: 8px; }

    .cycle-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--green-bg);
      border: 1px solid var(--green-border);
      border-radius: 10px 10px 0 0;
      font-size: 0.8rem;
    }

    .cycle-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--green);
      font-weight: 600;
    }

    .cycle-header-right {
      font-size: 0.78rem;
      color: rgba(34,197,94,0.6);
    }

    .entry-row {
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: none;
      padding: 13px 16px;
      display: grid;
      grid-template-columns: 90px 1fr 70px 70px 65px auto;
      align-items: center;
      gap: 12px;
      transition: background 0.15s;
    }

    .entry-row:last-child { border-radius: 0 0 10px 10px; }
    .entry-row:hover { background: var(--surface2); }

    .entry-date {
      font-size: 0.8rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .entry-comment {
      font-size: 0.83rem;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .entry-comment.empty { color: var(--muted); font-style: italic; }

    .entry-meter {
      font-size: 0.82rem;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      text-align: right;
    }

    .entry-usage {
      font-size: 0.88rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      text-align: right;
      color: var(--text);
    }

    .entry-avg {
      font-size: 0.78rem;
      font-variant-numeric: tabular-nums;
      text-align: right;
      color: var(--muted);
    }

    .entry-avg .avg-val {
      color: var(--accent);
      font-weight: 600;
    }

    .entry-usage.bill-reset { color: var(--green); }

    .badge {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 3px 7px;
      border-radius: 5px;
      white-space: nowrap;
    }

    .badge-entry {
      background: rgba(245,158,11,0.12);
      color: var(--accent);
      border: 1px solid rgba(245,158,11,0.2);
    }

    .badge-bill {
      background: var(--green-bg);
      color: var(--green);
      border: 1px solid var(--green-border);
    }

    .entry-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .btn-del {
      background: none;
      border: none;
      cursor: pointer;
      color: rgba(240,240,240,0.2);
      font-size: 0.9rem;
      padding: 4px;
      border-radius: 5px;
      transition: color 0.15s, background 0.15s;
      line-height: 1;
    }

    .btn-del:hover {
      color: var(--red);
      background: var(--red-bg);
    }

    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--muted);
      font-size: 0.88rem;
      border: 1px dashed rgba(255,255,255,0.1);
      border-radius: 14px;
    }

    .empty-state .icon { font-size: 2rem; margin-bottom: 10px; }

    .entry-col-headers {
      display: grid;
      grid-template-columns: 90px 1fr 70px 70px 65px auto;
      gap: 12px;
      padding: 6px 16px 8px;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(240,240,240,0.25);
    }

    .entry-col-headers span:nth-child(3),
    .entry-col-headers span:nth-child(4),
    .entry-col-headers span:nth-child(5) { text-align: right; }

    /* Responsive */
    @media (max-width: 580px) {
      body { padding: 68px 14px 48px; }
      .form-grid { grid-template-columns: 1fr; }
      .form-grid .span2 { grid-column: span 1; }
      .entries-section { overflow-x: auto; -webkit-overflow-scrolling: touch; }
      .entry-row, .entry-col-headers { min-width: 540px; }
      .cycle-bar { flex-direction: column; align-items: flex-start; }
      .cycle-bar-right { text-align: left; }
      .page-title { font-size: 1.4rem; }
    }
  </style>
</head>
<body>

<nav class="back-bar">
  <a href="dashboard.html" class="back-link">&#8592; Back to Dashboard</a>
</nav>

<div class="page-wrap">

  <div class="page-header">
    <h1 class="page-title">&#9889; Electricity Tracker</h1>
    <div class="page-subtitle">Log meter readings and track usage across billing cycles</div>
  </div>

  <!-- Consumer selector -->
  <div class="consumer-section">
    <div class="consumer-bar" id="consumerBar"></div>
    <div class="add-consumer-panel" id="addConsumerPanel" style="display:none">
      <div class="card-title" id="consumerPanelTitle">Add Consumer</div>
      <div class="form-grid">
        <div class="field">
          <label>Label</label>
          <input type="text" id="newConsumerLabel" placeholder="e.g. Home, Office" maxlength="40" />
        </div>
        <div class="field">
          <label>Consumer Number</label>
          <input type="text" id="newConsumerNumber" placeholder="Optional" maxlength="40" />
        </div>
      </div>
      <div class="add-consumer-actions">
        <button class="btn-save-consumer" id="btnSaveConsumer" onclick="saveConsumerForm()">Add Consumer</button>
        <button class="btn-cancel-consumer" onclick="toggleAddConsumer(false)">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Current cycle summary -->
  <div class="cycle-bar">
    <div>
      <div class="cycle-bar-label">Current Cycle Usage</div>
      <div>
        <span class="cycle-bar-value" id="cycleUsageVal">0</span>
        <span class="cycle-bar-unit">units</span>
      </div>
      <div class="cycle-bar-meta" id="cycleSince">No entries yet</div>
    </div>
    <div>
      <div class="cycle-bar-label">Avg Daily Usage</div>
      <div>
        <span class="cycle-bar-value" id="tillDateAvgVal" style="font-size:1.5rem">&#8212;</span>
        <span class="cycle-bar-unit">units/day</span>
      </div>
      <div class="cycle-bar-meta">till date</div>
    </div>
    <div class="cycle-bar-right">
      <div class="last-reading-label">Last meter reading</div>
      <div class="last-reading-val" id="lastReadingVal">&#8212;</div>
    </div>
  </div>

  <!-- Add entry form -->
  <div class="card">
    <div class="card-title">Add Entry</div>

    <div class="form-grid">

      <div class="field">
        <label>Date</label>
        <input type="date" id="entryDate" />
      </div>

      <div class="field">
        <label>Meter Reading (kWh)</label>
        <input type="number" id="meterReading" placeholder="e.g. 12450" min="0"
               oninput="previewUsage()" />
        <div class="usage-preview" id="usagePreview"></div>
      </div>

      <div class="field span2">
        <label>Comments</label>
        <input type="text" id="entryComment" placeholder="Optional note&hellip;" maxlength="120" />
      </div>

      <div class="field span2">
        <label>Entry type</label>
        <div class="type-group">
          <div class="type-option">
            <input type="radio" name="entryType" id="typeRegular" value="entry" checked />
            <label for="typeRegular">
              <span class="type-dot"></span>
              Regular entry
            </label>
          </div>
          <div class="type-option bill">
            <input type="radio" name="entryType" id="typeBill" value="bill" />
            <label for="typeBill">
              <span class="type-dot"></span>
              Bill received &#8212; reset cycle
            </label>
          </div>
        </div>
      </div>

    </div>

    <button class="btn-add" onclick="addEntry()">+ Add Entry</button>
  </div>

  <!-- Entries list -->
  <div class="entries-section" id="entriesSection"></div>

</div>

<script src="config.js"></script>
<script src="permissions.js"></script>
<script>window.addEventListener('load',function(){checkAppAccess('electricity-tracker');});</script>
<script>
  const token    = localStorage.getItem('auth_token');
  const API_BASE = window.API_BASE || '';

  function authHeaders() {
    return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token };
  }

  // _entries: regular meter entries only (consumer_meta filtered out)
  // _consumers: derived from consumer_meta entries stored in the same API table
  let _entries           = [];
  let _consumers         = [];
  let _activeId          = null;
  let _editingConsumerId = null;

  /* ── API calls ────────────────────────────────────────────────── */
  async function fetchAll() {
    const res  = await fetch(API_BASE + '/api/electricity', { headers: authHeaders() });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed to load');
    const all = data.entries || [];
    _consumers = all
      .filter(function(e) { return e.type === 'consumer_meta'; })
      .map(function(e) {
        var label = 'Consumer', number = '';
        // label+number are encoded in the comment field as JSON
        try {
          var meta = JSON.parse(e.comment || '');
          label  = meta.label  || label;
          number = meta.number || number;
        } catch (err) {
          // older entry with plain text comment or no comment
          if (e.comment) label = e.comment;
        }
        return { id: String(e.id), label: label, number: number, metaEntryId: e.id };
      });
    _entries = all
      .filter(function(e) { return e.type !== 'consumer_meta' && e.type !== 'calc_session' && e.type !== 'calc_appliance'; })
      .map(parseEntry);
  }

  // consumerId is encoded inside the comment field as JSON {_cid, text}
  // because the backend only persists the standard entry fields.
  function parseEntry(e) {
    var raw        = e.comment || '';
    var comment    = raw;
    var consumerId = e.consumerId ? String(e.consumerId) : null;
    if (raw.charAt(0) === '{') {
      try {
        var m = JSON.parse(raw);
        if ('_cid' in m) {
          consumerId = m._cid || null;
          comment    = m.text || '';
        }
      } catch (err) {}
    }
    return { id: e.id, date: e.date, meterReading: e.meterReading, usage: e.usage, comment: comment, type: e.type, consumerId: consumerId };
  }

  async function apiPostEntry(entry) {
    const res  = await fetch(API_BASE + '/api/electricity', {
      method: 'POST', headers: authHeaders(), body: JSON.stringify(entry),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed to save');
  }

  async function apiDeleteEntry(id) {
    const res  = await fetch(API_BASE + '/api/electricity/' + id, {
      method: 'DELETE', headers: authHeaders(),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed to delete');
  }

  /* ── Consumer management ──────────────────────────────────────── */
  async function apiCreateConsumer(label, number) {
    const id = Date.now();
    await apiPostEntry({
      id:           id,
      type:         'consumer_meta',
      date:         new Date().toISOString().slice(0, 10),
      meterReading: 0,
      usage:        0,
      comment:      JSON.stringify({ label: label, number: number }),
    });
    return String(id);
  }

  async function apiUpdateConsumer(consumer, label, number) {
    // Delete then re-create with the same ID to keep consumerId links valid
    await apiDeleteEntry(consumer.metaEntryId);
    await apiPostEntry({
      id:           consumer.metaEntryId,
      type:         'consumer_meta',
      date:         new Date().toISOString().slice(0, 10),
      meterReading: 0,
      usage:        0,
      comment:      JSON.stringify({ label: label, number: number }),
    });
  }

  function getEntriesForConsumer(id) {
    const isFirst = _consumers.length > 0 && _consumers[0].id === id;
    return _entries
      .filter(function(e) {
        if (String(e.consumerId) === id) return true;
        // Entries without consumerId belong to the first consumer (backward compat)
        if (isFirst && !e.consumerId) return true;
        return false;
      })
      // Cycle detection, per-entry usage and the day-span average all assume
      // chronological order — sort by date so we don't rely on API ordering.
      .sort(function(a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
  }

  function getActiveEntries() {
    return _activeId ? getEntriesForConsumer(_activeId) : [];
  }

  function resolveActiveId() {
    const stored = localStorage.getItem('electricity_active_consumer');
    if (stored && _consumers.find(function(c) { return c.id === stored; })) {
      _activeId = stored;
    } else {
      _activeId = _consumers.length > 0 ? _consumers[0].id : null;
      if (_activeId) localStorage.setItem('electricity_active_consumer', _activeId);
    }
  }

  function renderConsumerBar() {
    const bar = document.getElementById('consumerBar');
    let html  = '';
    _consumers.forEach(function(c) {
      const isActive = c.id === _activeId;
      const editBtn  = '<button class="tab-action-btn" onclick="event.stopPropagation();editConsumer(\'' + c.id + '\')" title="Edit">&#9998;</button>';
      const delBtn   = _consumers.length > 1
        ? '<button class="tab-action-btn" onclick="event.stopPropagation();deleteConsumer(\'' + c.id + '\')" title="Remove">&#10005;</button>'
        : '';
      html += '<div class="consumer-tab ' + (isActive ? 'active' : '') + '" onclick="switchConsumer(\'' + c.id + '\')">'
        + '<span>' + escapeHtml(c.label) + '</span>'
        + '<span class="tab-actions">' + editBtn + delBtn + '</span>'
        + '</div>';
    });
    html += '<button class="btn-add-consumer" onclick="toggleAddConsumer(true)">+ Add Consumer</button>';
    bar.innerHTML = html;
  }

  function switchConsumer(id) {
    if (_activeId === id) return;
    _activeId = id;
    localStorage.setItem('electricity_active_consumer', id);
    toggleAddConsumer(false);
    renderConsumerBar();
    renderAll();
  }

  function toggleAddConsumer(show) {
    const panel = document.getElementById('addConsumerPanel');
    panel.style.display = show ? '' : 'none';
    if (show) {
      document.getElementById('newConsumerLabel').value  = '';
      document.getElementById('newConsumerNumber').value = '';
      setTimeout(function() { document.getElementById('newConsumerLabel').focus(); }, 50);
    } else {
      _editingConsumerId = null;
      document.getElementById('consumerPanelTitle').textContent = 'Add Consumer';
      document.getElementById('btnSaveConsumer').textContent    = 'Add Consumer';
      document.getElementById('btnSaveConsumer').disabled       = false;
    }
  }

  function editConsumer(id) {
    const consumer = _consumers.find(function(c) { return c.id === id; });
    if (!consumer) return;
    _editingConsumerId = id;
    document.getElementById('newConsumerLabel').value         = consumer.label;
    document.getElementById('newConsumerNumber').value        = consumer.number;
    document.getElementById('consumerPanelTitle').textContent = 'Edit Consumer';
    document.getElementById('btnSaveConsumer').textContent    = 'Save Changes';
    document.getElementById('addConsumerPanel').style.display = '';
    setTimeout(function() { document.getElementById('newConsumerLabel').focus(); }, 50);
  }

  async function saveConsumerForm() {
    const label  = document.getElementById('newConsumerLabel').value.trim();
    const number = document.getElementById('newConsumerNumber').value.trim();
    if (!label) { alert('Please enter a label.'); return; }
    const btn    = document.getElementById('btnSaveConsumer');
    const isEdit = !!_editingConsumerId;
    btn.disabled    = true;
    btn.textContent = 'Saving…';
    try {
      if (isEdit) {
        const consumer = _consumers.find(function(c) { return c.id === _editingConsumerId; });
        await apiUpdateConsumer(consumer, label, number);
      } else {
        const newId = await apiCreateConsumer(label, number);
        _activeId   = newId;
        localStorage.setItem('electricity_active_consumer', newId);
      }
      await fetchAll();
      toggleAddConsumer(false);
      renderConsumerBar();
      renderAll();
    } catch (err) {
      alert('Error: ' + err.message);
      btn.disabled    = false;
      btn.textContent = isEdit ? 'Save Changes' : 'Add Consumer';
    }
  }

  async function deleteConsumer(id) {
    if (_consumers.length <= 1) { alert('Cannot remove the only consumer.'); return; }
    const consumer = _consumers.find(function(c) { return c.id === id; });
    if (!consumer) return;
    const count = getEntriesForConsumer(id).length;
    const msg   = count > 0
      ? 'Remove "' + consumer.label + '"? It has ' + count + ' entr' + (count === 1 ? 'y' : 'ies') + ' — they will no longer be shown.'
      : 'Remove "' + consumer.label + '"?';
    if (!confirm(msg)) return;
    try {
      await apiDeleteEntry(consumer.metaEntryId);
      await fetchAll();
      if (_activeId === id) {
        _activeId = _consumers.length > 0 ? _consumers[0].id : null;
        if (_activeId) localStorage.setItem('electricity_active_consumer', _activeId);
      }
      renderConsumerBar();
      renderAll();
    } catch (err) {
      alert('Error: ' + err.message);
    }
  }

  /* ── Button loading state ─────────────────────────────────────── */
  function setBusy(on) {
    const btn       = document.querySelector('.btn-add');
    btn.disabled    = on;
    btn.textContent = on ? 'Saving…' : '+ Add Entry';
    document.getElementById('entriesSection').style.opacity = on ? '0.5' : '1';
  }

  document.getElementById('entryDate').value = new Date().toISOString().slice(0, 10);

  /* ── Usage preview ────────────────────────────────────────────── */
  function previewUsage() {
    const val = parseFloat(document.getElementById('meterReading').value);
    const el  = document.getElementById('usagePreview');
    if (isNaN(val) || document.getElementById('meterReading').value === '') {
      el.innerHTML = ''; return;
    }
    const ae = getActiveEntries();
    if (ae.length === 0) {
      el.innerHTML = '<span>First entry — usage will be 0</span>'; return;
    }
    const prev  = ae[ae.length - 1].meterReading;
    const usage = val - prev;
    if (usage < 0) {
      el.innerHTML = '<span style="color:var(--red)">&#9888; Reading is lower than previous (' + prev + ')</span>';
    } else {
      el.innerHTML = 'Usage since last entry: <span class="uval">+' + usage + ' units</span>';
    }
  }

  /* ── Add entry ────────────────────────────────────────────────── */
  async function addEntry() {
    const date    = document.getElementById('entryDate').value;
    const reading = parseFloat(document.getElementById('meterReading').value);
    const comment = document.getElementById('entryComment').value.trim();
    const type    = document.querySelector('input[name="entryType"]:checked').value;

    if (!date) { alert('Please select a date.'); return; }
    if (isNaN(reading) || document.getElementById('meterReading').value === '') {
      alert('Please enter a meter reading.'); return;
    }
    if (!_activeId) { alert('Please add a consumer first.'); return; }

    const ae    = getActiveEntries();
    const prev  = ae.length > 0 ? ae[ae.length - 1].meterReading : reading;
    const usage = reading - prev;

    if (usage < 0 && !confirm('Meter reading (' + reading + ') is lower than previous (' + prev + '). Add anyway?')) return;

    setBusy(true);
    try {
      await apiPostEntry({
        id:           Date.now(),
        date:         date,
        meterReading: reading,
        usage:        ae.length === 0 ? 0 : usage,
        comment:      JSON.stringify({ _cid: _activeId, text: comment }),
        type:         type,
      });
      await fetchAll();
      document.getElementById('meterReading').value  = '';
      document.getElementById('entryComment').value  = '';
      document.getElementById('entryDate').value     = new Date().toISOString().slice(0, 10);
      document.getElementById('typeRegular').checked = true;
      document.getElementById('usagePreview').innerHTML = '';
      renderAll();
    } catch (err) {
      alert('Error: ' + err.message);
    } finally {
      setBusy(false);
    }
  }

  /* ── Delete entry ─────────────────────────────────────────────── */
  async function deleteEntry(id) {
    if (!confirm('Delete this entry?')) return;
    setBusy(true);
    try {
      await apiDeleteEntry(id);
      await fetchAll();
      renderAll();
    } catch (err) {
      alert('Error: ' + err.message);
    } finally {
      setBusy(false);
    }
  }

  /* ── XSS prevention ───────────────────────────────────────────── */
  function escapeHtml(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  /* ── Format date ──────────────────────────────────────────────── */
  function fmtDate(iso) {
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: '2-digit' });
  }

  /* ── Render all ───────────────────────────────────────────────── */
  function renderAll() {
    const ae = getActiveEntries();
    updateCycleBar(ae);
    renderEntries(ae);
    previewUsage();
  }

  /* ── Days between two ISO date strings ───────────────────────── */
  function daysBetween(iso1, iso2) {
    return Math.round((new Date(iso2 + 'T00:00:00') - new Date(iso1 + 'T00:00:00')) / 86400000);
  }

  /* ── Per-entry avg daily usage map ───────────────────────────── */
  function computeAvgPerEntry(entries) {
    const map = {};
    for (let i = 0; i < entries.length; i++) {
      const e = entries[i];
      if (i === 0 || e.usage <= 0) { map[e.id] = null; continue; }
      const days = daysBetween(entries[i - 1].date, e.date);
      map[e.id]  = days > 0 ? (e.usage / days).toFixed(1) : null;
    }
    return map;
  }

  /* ── Cycle bar ────────────────────────────────────────────────── */
  function updateCycleBar(entries) {
    if (entries.length === 0) {
      document.getElementById('cycleUsageVal').textContent  = '0';
      document.getElementById('cycleSince').textContent     = 'No entries yet';
      document.getElementById('lastReadingVal').textContent = '—';
      document.getElementById('tillDateAvgVal').textContent = '—';
      return;
    }
    const last = entries[entries.length - 1];
    document.getElementById('lastReadingVal').textContent = last.meterReading + ' kWh';

    let cycleStartIdx = 0;
    for (let i = entries.length - 1; i >= 0; i--) {
      if (entries[i].type === 'bill') { cycleStartIdx = i + 1; break; }
    }
    const cycleEntries = entries.slice(cycleStartIdx);
    const cycleUsage   = cycleEntries.reduce(function(sum, e) { return sum + (e.usage > 0 ? e.usage : 0); }, 0);
    document.getElementById('cycleUsageVal').textContent = cycleUsage;
    document.getElementById('cycleSince').textContent    = cycleEntries.length > 0
      ? 'Since ' + fmtDate(cycleEntries[0].date) + ' · ' + cycleEntries.length + ' entr' + (cycleEntries.length === 1 ? 'y' : 'ies')
      : 'New cycle started';

    // Avg daily usage for the CURRENT cycle only: usage accrued since the last
    // bill, divided by the days since that bill (or since the first reading if
    // no bill has been logged yet). The average resets whenever a bill is added.
    const cycleStartDate = cycleStartIdx > 0 ? entries[cycleStartIdx - 1].date : entries[0].date;
    const cycleDays      = daysBetween(cycleStartDate, last.date);
    document.getElementById('tillDateAvgVal').textContent =
      cycleDays > 0 ? (cycleUsage / cycleDays).toFixed(1) : '—';
  }

  /* ── Render entries list ──────────────────────────────────────── */
  function renderEntries(entries) {
    const section = document.getElementById('entriesSection');
    if (entries.length === 0) {
      section.innerHTML = '<div class="empty-state"><div class="icon">&#9889;</div>No entries yet. Add your first meter reading above.</div>';
      return;
    }

    const cycles = [];
    let current    = [];
    let cycleStart = entries[0].date;   // first cycle is measured from the first reading
    for (const entry of entries) {
      current.push(entry);
      if (entry.type === 'bill') {
        cycles.push({ items: [...current], start: cycleStart });
        cycleStart = entry.date;        // the next cycle starts at this bill's date
        current = [];
      }
    }
    if (current.length > 0) cycles.push({ items: [...current], start: cycleStart });
    cycles.reverse();

    const avgMap = computeAvgPerEntry(entries);

    let html = '';
    cycles.forEach(function(c, ci) {
      const cycle    = c.items;
      const isOpen   = ci === 0 && cycle[cycle.length - 1].type !== 'bill';
      const total    = cycle.reduce(function(sum, e) { return sum + (e.usage > 0 ? e.usage : 0); }, 0);
      const from     = fmtDate(c.start);
      const to       = fmtDate(cycle[cycle.length - 1].date);
      const days     = daysBetween(c.start, cycle[cycle.length - 1].date);
      const cycleAvg = days > 0 ? (total / days).toFixed(1) : null;

      html += isOpen
        ? '<div class="entry-col-headers"><span>Date</span><span>Comment</span><span>Meter</span><span>Usage</span><span>Avg/day</span><span></span></div>'
        : '<div class="cycle-header"><div class="cycle-header-left">&#10003; Billing cycle &nbsp;&middot;&nbsp; ' + from + ' &rarr; ' + to + '</div><div class="cycle-header-right">Total: ' + total + ' units' + (cycleAvg !== null ? ' &nbsp;&middot;&nbsp; Avg: ' + cycleAvg + ' u/d' : '') + '</div></div>';

      [...cycle].reverse().forEach(function(entry) {
        const isBill   = entry.type === 'bill';
        const usageTxt = (entry.usage === 0 && entry === cycle[0]) ? '—' : (entry.usage >= 0 ? '+' + entry.usage : entry.usage) + ' u';
        const avg      = avgMap[entry.id];
        const avgTxt   = avg !== null ? '<span class="avg-val">' + avg + '</span> u/d' : '—';
        html += '<div class="entry-row">'
          + '<span class="entry-date">' + fmtDate(entry.date) + '</span>'
          + '<span class="entry-comment ' + (entry.comment ? '' : 'empty') + '">' + (entry.comment ? escapeHtml(entry.comment) : 'No comment') + '</span>'
          + '<span class="entry-meter">' + entry.meterReading + '</span>'
          + '<span class="entry-usage ' + (isBill ? 'bill-reset' : '') + '">' + usageTxt + '</span>'
          + '<span class="entry-avg">' + avgTxt + '</span>'
          + '<span class="entry-actions">'
          + '<span class="badge ' + (isBill ? 'badge-bill' : 'badge-entry') + '">' + (isBill ? 'Bill' : 'Entry') + '</span>'
          + '<button class="btn-del" onclick="deleteEntry(' + entry.id + ')" title="Delete">&#10005;</button>'
          + '</span></div>';
      });
    });
    section.innerHTML = html;
  }

  /* ── Init ─────────────────────────────────────────────────────── */
  document.getElementById('entriesSection').innerHTML =
    '<div class="empty-state"><div class="icon">&#9889;</div>Loading…</div>';

  fetchAll()
    .then(async function() {
      if (_consumers.length === 0) {
        // Auto-create a Default consumer on first use
        const newId = await apiCreateConsumer('Default', '');
        await fetchAll();
        _activeId = newId;
        localStorage.setItem('electricity_active_consumer', newId);
      } else {
        resolveActiveId();
      }
      renderConsumerBar();
      renderAll();
    })
    .catch(function(err) {
      document.getElementById('entriesSection').innerHTML =
        '<div class="empty-state" style="color:var(--red)">Failed to load: ' + escapeHtml(err.message) + '</div>';
    });
</script>
<script src="session-guard.js"></script>
</body>
</html>
