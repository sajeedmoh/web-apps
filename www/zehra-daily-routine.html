<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zehra's Daily Routine</title>
  <script>if (!localStorage.getItem('auth_session')) window.location.replace('login.html');</script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #e5e5ea;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .app-shell {
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      background: #f2f2f7;
      box-shadow: 0 0 40px rgba(0,0,0,0.15);
    }

    /* ── Fixed nav bar (matches other pages) ── */
    .back-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      background: rgba(15,17,23,0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      height: 44px;
    }
    .back-link {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      color: rgba(255,255,255,0.55);
      text-decoration: none;
      transition: color 0.18s;
    }
    .back-link:hover { color: #fff; }
    .save-badge {
      font-size: 0.65rem;
      color: rgba(255,255,255,0.45);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .save-badge.visible { opacity: 1; }

    /* ── Header ───────────────────────────── */
    .header {
      background: #1c1c2e;
      padding: 54px 16px 0;
      position: relative;
    }
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 28px;
    }

    .header-center { text-align: center; margin-top: 6px; }
    .today-label {
      font-size: 1.6rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1;
    }
    .today-date {
      font-size: 0.72rem;
      color: rgba(255,255,255,0.45);
      margin-top: 2px;
    }

    /* ── Earnings circle ──────────────────── */
    .earnings-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 14px 16px 4px;
    }
    .earn-circle-wrap { position: relative; flex-shrink: 0; }
    .earn-svg { display: block; transform: rotate(-90deg); }
    .earn-track { fill: none; stroke: rgba(255,255,255,0.1); }
    .earn-fill  { fill: none; stroke-linecap: round; transition: stroke-dashoffset 0.5s ease, stroke 0.4s; }
    .earn-center {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .earn-amount {
      font-size: 1.15rem; font-weight: 800; color: #fff; line-height: 1;
    }
    .earn-unit { font-size: 0.58rem; color: rgba(255,255,255,0.5); margin-top: 1px; }

    .earn-pos  { color: #1dd1a1; }
    .earn-neg  { color: #ff6b6b; }
    .earn-zero { color: rgba(255,255,255,0.4); }


    .btn-add-float {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: #4a90e2;
      border: none;
      color: #fff;
      font-size: 1.3rem;
      line-height: 1;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(74,144,226,0.4);
      transition: filter 0.15s;
    }
    .btn-add-float:hover { filter: brightness(1.15); }
    .btn-reset-float {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: rgba(255,59,48,0.15);
      border: none;
      color: #ff3b30;
      font-size: 1.1rem;
      line-height: 1;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .btn-reset-float:hover { background: rgba(255,59,48,0.28); }

    /* ── Week strip ───────────────────────── */
    .week-strip {
      display: flex;
      justify-content: space-between;
      padding: 12px 0 0;
      gap: 0;
    }
    .day-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      flex: 1;
      cursor: pointer;
      padding: 4px 2px 10px;
      border: none;
      background: none;
      border-radius: 10px;
      transition: background 0.15s;
      min-width: 0;
    }
    .day-btn:hover { background: rgba(255,255,255,0.05); }
    .day-name {
      font-size: 0.58rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.38);
    }
    .day-num {
      width: 28px; height: 28px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.82rem;
      font-weight: 600;
      color: rgba(255,255,255,0.5);
    }
    .day-btn.today .day-name { color: #fff; }
    .day-btn.today .day-num {
      background: #4a90e2;
      color: #fff;
      box-shadow: 0 0 0 2px rgba(74,144,226,0.35);
    }
    .day-btn.selected:not(.today) .day-num {
      background: rgba(255,255,255,0.12);
      color: #fff;
    }
    .day-btn.selected:not(.today) .day-name { color: rgba(255,255,255,0.65); }
    .day-btn.future { opacity: 0.3; cursor: default; }
    .day-dot {
      width: 4px; height: 4px; border-radius: 50%;
      background: transparent;
      margin-top: -2px;
    }
    .day-btn.has-data .day-dot { background: rgba(255,255,255,0.3); }
    .day-btn.today .day-dot    { background: #4a90e2; }

    /* ── Add item panel (admin) ────────────── */
    .add-panel {
      display: none;
      background: #252538;
      padding: 12px 16px;
      gap: 10px;
      align-items: center;
    }
    .add-panel.open { display: flex; }
    .add-input {
      flex: 1;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 9px 12px;
      color: #fff;
      font-size: 0.88rem;
      font-family: inherit;
      outline: none;
    }
    .add-input::placeholder { color: rgba(255,255,255,0.3); }
    .add-input:focus { border-color: rgba(74,144,226,0.6); }
    .btn-save-item {
      background: #4a90e2;
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 700;
      font-family: inherit;
      padding: 9px 16px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-save-item:disabled { opacity: 0.5; }

    /* ── List ──────────────────────────────── */
    .list-wrap {
      padding: 10px 12px 32px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .routine-card {
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 11px;
      cursor: pointer;
      user-select: none;
      position: relative;
      overflow: hidden;
      transition: transform 0.1s, filter 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .routine-card:active { transform: scale(0.97); }
    .routine-card.done { filter: brightness(0.72) saturate(0.55); }

    .card-icon {
      font-size: 1.2rem;
      flex-shrink: 0;
      line-height: 1;
    }
    .card-body { flex: 1; min-width: 0; }
    .card-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-done-label {
      font-size: 0.65rem;
      color: rgba(255,255,255,0.6);
      margin-top: 1px;
      display: none;
    }
    .routine-card.done .card-done-label { display: block; }

    .check-ring {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.5);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.18s, border-color 0.18s;
      background: none;
    }
    .routine-card.done .check-ring {
      background: rgba(255,255,255,0.95);
      border-color: rgba(255,255,255,0.95);
    }
    .check-ring svg { display: none; }
    .routine-card.done .check-ring svg { display: block; }

    .btn-del-card {
      position: absolute;
      top: 5px; right: 5px;
      background: rgba(0,0,0,0.18);
      border: none;
      color: rgba(255,255,255,0.65);
      font-size: 0.72rem;
      width: 20px; height: 20px;
      border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      line-height: 1;
      transition: background 0.15s;
    }
    .btn-del-card:hover { background: rgba(255,0,0,0.4); color: #fff; }

    /* ── Viewing past day ──────────────────── */
    .past-banner {
      background: rgba(74,144,226,0.1);
      border: 1px solid rgba(74,144,226,0.22);
      border-radius: 8px;
      margin: 8px 12px 0;
      padding: 6px 12px;
      font-size: 0.72rem;
      color: rgba(74,144,226,0.9);
      text-align: center;
      display: none;
    }
    .past-banner.visible { display: block; }

    /* ── Empty / all-done ──────────────────── */
    .empty-card {
      text-align: center;
      padding: 48px 20px;
      color: #8e8e93;
      font-size: 0.88rem;
    }
    .empty-card .icon { font-size: 2.4rem; margin-bottom: 10px; }

    .all-done-card {
      border-radius: 12px;
      background: linear-gradient(135deg, #1dd1a1, #00b894);
      color: #fff;
      text-align: center;
      padding: 12px;
      font-size: 0.85rem;
      font-weight: 700;
      display: none;
      box-shadow: 0 3px 12px rgba(29,209,161,0.3);
      margin: 0 12px;
    }
    .all-done-card.visible { display: block; }

    /* ── History (admin, past days) ────────── */
    .history-section { padding: 0 0 40px; }
    .hist-title {
      font-size: 0.68rem; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: #8e8e93; padding: 0 16px; margin-bottom: 8px;
    }

    /* Month navigator */
    .hist-month-nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 10px 4px;
    }
    .hist-month-btn {
      background: none; border: none; cursor: pointer;
      font-size: 1.1rem; color: #636366; padding: 6px 10px;
      border-radius: 8px; line-height: 1;
    }
    .hist-month-btn:hover { background: rgba(0,0,0,0.06); }
    .hist-month-label { font-size: 0.88rem; font-weight: 700; color: #1c1c1e; }

    /* Calendar grid */
    .hist-cal { padding: 0 10px 4px; }
    .hist-cal-head {
      display: grid; grid-template-columns: repeat(7, 1fr);
      margin-bottom: 2px;
    }
    .hist-cal-head span {
      text-align: center; font-size: 0.6rem; font-weight: 700;
      color: #aeaeb2; padding: 2px 0; display: block;
    }
    .hist-cal-grid {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px;
    }
    .hist-day {
      aspect-ratio: 1; border-radius: 8px; border: none; background: transparent;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; cursor: pointer; position: relative;
      font-size: 0.72rem; font-weight: 600; color: #c7c7cc;
    }
    .hist-day.has-data { cursor: pointer; }
    .hist-day.hist-full  { background: rgba(29,209,161,0.15); color: #0a8a6a; }
    .hist-day.hist-partial { background: rgba(255,159,67,0.15); color: #c47a00; }
    .hist-day.hist-miss  { background: rgba(255,107,107,0.13); color: #c0392b; }
    .hist-day.hist-today-cal { box-shadow: inset 0 0 0 2px #4f8ef7; color: #4f8ef7; }
    .hist-day.hist-selected { box-shadow: inset 0 0 0 2px #1c1c1e; }
    .hist-day-num { line-height: 1; }
    .hist-day-dot {
      width: 4px; height: 4px; border-radius: 50%; margin-top: 2px;
      background: currentColor; opacity: 0.6;
    }

    /* Day detail */
    .hist-detail {
      margin: 6px 14px 0; background: #fff; border-radius: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08); overflow: hidden;
    }
    .hist-detail-hdr {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 14px 8px;
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }
    .hist-detail-date { font-size: 0.78rem; font-weight: 700; color: #1c1c1e; }
    .hist-detail-badge {
      font-size: 0.65rem; font-weight: 700; padding: 2px 8px;
      border-radius: 10px; background: #f2f2f7; color: #636366;
    }
    .hist-detail-badge.full { background: #dcfce7; color: #15803d; }
    .hist-detail-list { padding: 4px 0 6px; }
    .hist-detail-row {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 14px; font-size: 0.78rem; color: #1c1c1e;
    }
    .hist-detail-row + .hist-detail-row { border-top: 1px solid rgba(0,0,0,0.04); }
    .hist-detail-icon { font-size: 0.7rem; width: 16px; text-align: center; flex-shrink: 0; }
    .hist-detail-icon.done { color: #1dd1a1; }
    .hist-detail-icon.miss { color: #ff6b6b; }
    .hist-empty { font-size: 0.8rem; color: #8e8e93; text-align: center; padding: 16px 0; }
  </style>
</head>
<body>
<div class="app-shell">

<!-- ── Fixed nav bar ──────────────────────────── -->
<nav class="back-bar">
  <a href="dashboard.html" class="back-link">&#8592; Back to Dashboard</a>
  <span class="save-badge" id="saveBadge">Saving…</span>
</nav>

<!-- ── Header ─────────────────────────────────── -->
<div class="header">
  <div class="header-top">
    <button class="btn-reset-float" id="btnResetEarn" style="display:none" onclick="resetEarnings()" title="Reset earnings to ₹0">↺</button>
    <div class="header-center" style="flex:1">
      <div class="today-label" id="viewingLabel">TODAY</div>
      <div class="today-date" id="viewingDate"></div>
    </div>
    <button class="btn-add-float" id="btnAddFloat" style="display:none" onclick="toggleAddPanel()" title="Add item">+</button>
  </div>

  <!-- Earnings circles -->
  <div class="earnings-row">
    <div class="earn-circle-wrap">
      <svg class="earn-svg" width="88" height="88" viewBox="0 0 88 88">
        <circle class="earn-track" cx="44" cy="44" r="36" stroke-width="7"/>
        <circle class="earn-fill" cx="44" cy="44" r="36" stroke-width="7"
                id="earnFill" stroke-dasharray="226" stroke-dashoffset="226" stroke="#1dd1a1"/>
      </svg>
      <div class="earn-center">
        <div class="earn-amount" id="earnTotal">₹0</div>
        <div class="earn-unit">total</div>
      </div>
    </div>
    <div class="earn-circle-wrap">
      <svg class="earn-svg" width="88" height="88" viewBox="0 0 88 88">
        <circle class="earn-track" cx="44" cy="44" r="36" stroke-width="7"/>
        <circle class="earn-fill" cx="44" cy="44" r="36" stroke-width="7"
                id="earnTodayFill" stroke-dasharray="226" stroke-dashoffset="226" stroke="#1dd1a1"/>
      </svg>
      <div class="earn-center">
        <div class="earn-amount" id="earnToday">₹0</div>
        <div class="earn-unit">today</div>
      </div>
    </div>
  </div>

  <!-- Week strip -->
  <div class="week-strip" id="weekStrip"></div>
</div>

<!-- Add item panel (admin) -->
<div class="add-panel" id="addPanel">
  <input class="add-input" id="newItemText" placeholder="Add a routine item…" maxlength="120"
         onkeydown="if(event.key==='Enter') addItem()" />
  <button class="btn-save-item" id="btnSaveItem" onclick="addItem()">Save</button>
</div>

<!-- Past-day banner -->
<div class="past-banner" id="pastBanner"></div>

<!-- Checklist -->
<div class="list-wrap" id="listWrap">
  <div class="empty-card"><div>Loading…</div></div>
</div>

<div class="all-done-card" id="allDone">🎉 Amazing! All done for today!</div>

<!-- History (admin) -->
<div class="history-section" id="historySection" style="display:none">
  <div class="hist-title">Completion History</div>
  <div class="hist-month-nav">
    <button class="hist-month-btn" onclick="histPrevMonth()">&#8249;</button>
    <span class="hist-month-label" id="histMonthLabel"></span>
    <button class="hist-month-btn" onclick="histNextMonth()">&#8250;</button>
  </div>
  <div class="hist-cal">
    <div class="hist-cal-head">
      <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
    </div>
    <div class="hist-cal-grid" id="histCalGrid"></div>
  </div>
  <div id="histDetail"></div>
</div>

</div><!-- /.app-shell -->
<script src="config.js"></script>
<script src="permissions.js"></script>
<script>window.addEventListener('load', function() { checkAppAccess('zehra-daily-routine'); });</script>
<script>
  /* ── Session ───────────────────────────────────────────────────────── */
  var _session = JSON.parse(localStorage.getItem('auth_session') || 'null');
  var _token   = localStorage.getItem('auth_token');
  var isAdmin  = _session && _session.role === 'admin';

  /* ── Colors ────────────────────────────────────────────────────────── */
  var COLORS = ['#e74c3c','#e67e22','#2980b9','#8e44ad','#16a085',
                '#27ae60','#f39c12','#c0392b','#1abc9c','#d35400'];

  /* ── State ─────────────────────────────────────────────────────────── */
  var _items       = [];
  var _completions = {};

  function localDateStr(d) {
    var dt = d || new Date();
    return dt.getFullYear() + '-'
      + String(dt.getMonth() + 1).padStart(2, '0') + '-'
      + String(dt.getDate()).padStart(2, '0');
  }

  var _today          = localDateStr();
  var _viewDate       = _today;
  var _totalEarned    = 0;
  var _processedDates = [];

  /* ── Auth ──────────────────────────────────────────────────────────── */
  function authHeaders() {
    return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + _token };
  }

  /* ── Save badge ────────────────────────────────────────────────────── */
  var _hideTimer = null;
  function showSaving() {
    clearTimeout(_hideTimer);
    var el = document.getElementById('saveBadge');
    el.textContent = 'Saving…';
    el.classList.add('visible');
  }
  function hideSaving() {
    _hideTimer = setTimeout(function() {
      document.getElementById('saveBadge').classList.remove('visible');
    }, 900);
  }

  /* ── Date helpers ──────────────────────────────────────────────────── */
  var DAY_NAMES   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var DAYS_LONG   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var MONTHS      = ['January','February','March','April','May','June',
                     'July','August','September','October','November','December'];
  var MONTHS_S    = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  function formatLong(dateStr) {
    var d = new Date(dateStr + 'T00:00:00');
    return DAYS_LONG[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
  }
  function formatShort(dateStr) {
    var d = new Date(dateStr + 'T00:00:00');
    return d.getDate() + ' ' + MONTHS_S[d.getMonth()] + ' ' + d.getFullYear();
  }

  /* ── Build week (3 days before today, today, 3 after) ─────────────── */
  function buildWeek() {
    var strip = document.getElementById('weekStrip');
    strip.innerHTML = '';
    for (var offset = -3; offset <= 3; offset++) {
      var d = new Date();
      d.setDate(d.getDate() + offset);
      var ds = localDateStr(d);
      var isFuture = ds > _today;
      var isToday  = ds === _today;
      var isSelected = ds === _viewDate;
      var hasData  = !!_completions[ds] && _completions[ds].length > 0;

      var btn = document.createElement('button');
      btn.className = 'day-btn'
        + (isToday    ? ' today'    : '')
        + (isSelected ? ' selected' : '')
        + (isFuture   ? ' future'   : '')
        + (hasData    ? ' has-data' : '');
      btn.dataset.date = ds;
      btn.disabled = isFuture;
      btn.innerHTML =
        '<span class="day-name">' + DAY_NAMES[d.getDay()] + '</span>'
        + '<span class="day-num">' + d.getDate() + '</span>'
        + '<span class="day-dot"></span>';
      btn.addEventListener('click', function() { navigateTo(this.dataset.date); });
      strip.appendChild(btn);
    }
  }

  function navigateTo(dateStr) {
    if (dateStr > _today) return;
    _viewDate = dateStr;
    updateViewHeader();
    buildWeek();
    render();
  }

  function updateViewHeader() {
    var isToday = _viewDate === _today;
    document.getElementById('viewingLabel').textContent = isToday ? 'TODAY' : DAY_NAMES[new Date(_viewDate + 'T00:00:00').getDay()].toUpperCase();
    document.getElementById('viewingDate').textContent = isToday
      ? formatShort(_today)
      : formatLong(_viewDate);

    var banner = document.getElementById('pastBanner');
    if (!isToday) {
      banner.textContent = 'Viewing ' + formatLong(_viewDate) + ' — read only';
      banner.classList.add('visible');
    } else {
      banner.classList.remove('visible');
    }
  }

  /* ── Fetch ─────────────────────────────────────────────────────────── */
  async function fetchAll() {
    var res  = await fetch(API_BASE + '/api/zehra-routine', { headers: authHeaders() });
    var data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed to load');
    _items          = data.items          || [];
    _completions    = data.completions    || {};
    _totalEarned    = data.totalEarned    || 0;
    _processedDates = data.processedDates || [];
  }

  function viewDone()   { return _completions[_viewDate] || []; }
  function isDone(id)   { var done = viewDone(); return done.indexOf(id) !== -1 || done.map(Number).indexOf(Number(id)) !== -1; }

  /* ── Earnings helpers ──────────────────────────────────────────────── */
  function dailyEarning(dateStr) {
    var completedIds = _completions[dateStr] || [];
    var completed    = completedIds.length;
    var total        = _items.length;
    return completed - (total - completed); // +1 per done, -1 per missed
  }

  function rupeeStr(val) {
    return (val >= 0 ? '+' : '') + '₹' + val;
  }

  function updateEarningsUI() {
    var todayEarning = dailyEarning(_today);
    var circumf = 226;
    var pct = _items.length > 0 ? ((_completions[_today] || []).length / _items.length) : 0;

    // Total circle: finalized historical total only, updated at midnight
    var totalFillEl = document.getElementById('earnFill');
    var totalIsPos = _totalEarned >= 0;
    totalFillEl.style.strokeDashoffset = _totalEarned === 0 ? circumf : circumf - pct * circumf;
    totalFillEl.style.stroke = totalIsPos ? '#1dd1a1' : '#ff6b6b';
    var totalEl = document.getElementById('earnTotal');
    totalEl.textContent = '₹' + _totalEarned;
    totalEl.style.color = totalIsPos ? '#1dd1a1' : '#ff6b6b';

    // Today circle: live today earning, resets to ₹0 at midnight
    var todayFillEl = document.getElementById('earnTodayFill');
    var todayIsPos = todayEarning >= 0;
    todayFillEl.style.strokeDashoffset = circumf - pct * circumf;
    todayFillEl.style.stroke = todayIsPos ? '#1dd1a1' : '#ff6b6b';
    var todayEl = document.getElementById('earnToday');
    todayEl.textContent = rupeeStr(todayEarning);
    todayEl.style.color = todayIsPos ? '#1dd1a1' : '#ff6b6b';
  }

  /* ── Finalize yesterday (auto) ─────────────────────────────────────── */
  async function finalizeUnprocessedDays() {
    // Get yesterday's date string
    var yd = new Date(); yd.setDate(yd.getDate() - 1);
    var yesterday = localDateStr(yd);
    if (_processedDates.indexOf(yesterday) !== -1) return; // already done
    try {
      var res  = await fetch(API_BASE + '/api/zehra-routine/finalize-day', {
        method: 'POST', headers: authHeaders(),
        body: JSON.stringify({ date: yesterday })
      });
      var data = await res.json();
      if (res.ok && !data.alreadyProcessed) {
        _totalEarned = data.totalEarned;
        _processedDates.push(yesterday);
        updateEarningsUI();
      }
    } catch(e) { /* silently skip */ }
  }

  /* ── Reset earnings (admin) ────────────────────────────────────────── */
  async function resetEarnings() {
    if (!confirm('Reset total earned to ₹0? This cannot be undone.')) return;
    showSaving();
    try {
      var res  = await fetch(API_BASE + '/api/zehra-routine/reset-earnings', {
        method: 'POST', headers: authHeaders()
      });
      var data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed');
      _totalEarned = 0;
      updateEarningsUI();
    } catch(ex) { alert('Error: ' + ex.message); }
    hideSaving();
  }

  /* ── Render ────────────────────────────────────────────────────────── */
  function render() {
    var wrap = document.getElementById('listWrap');
    var isViewingToday = _viewDate === _today;

    if (_items.length === 0) {
      wrap.innerHTML = '<div class="empty-card"><div class="icon">📋</div>'
        + (isAdmin ? 'No items yet — tap + to add one.' : 'No routine items added yet.') + '</div>';
      document.getElementById('allDone').classList.remove('visible');
      return;
    }

    var doneCount = 0;
    var html = '';
    _items.forEach(function(item, i) {
      var done  = isDone(item.id);
      var color = COLORS[i % COLORS.length];
      if (done) doneCount++;

      // Checkmark SVG (colored to match card background)
      var checkSvg = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="' + color + '" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

      html += '<div class="routine-card' + (done ? ' done' : '') + '" id="rc_' + item.id + '"'
        + ' style="background:' + color + '"'
        + (isViewingToday ? ' onclick="toggleItem(' + item.id + ')"' : '')
        + '>'
        + '<div class="card-icon">' + iconFor(i) + '</div>'
        + '<div class="card-body">'
        + '<div class="card-title">' + esc(item.text) + '</div>'
        + '<div class="card-done-label">Completed ✓</div>'
        + '</div>'
        + '<div class="check-ring">' + checkSvg + '</div>'
        + (isAdmin && isViewingToday ? '<button class="btn-del-card" onclick="event.stopPropagation();deleteItem(' + item.id + ')" title="Remove">×</button>' : '')
        + '</div>';
    });

    wrap.innerHTML = html;

    var allDoneEl = document.getElementById('allDone');
    allDoneEl.classList.toggle('visible', isViewingToday && doneCount === _items.length && _items.length > 0);
  }

  /* ── Icon mapping ──────────────────────────────────────────────────── */
  var ICONS = ['🌅','☀️','🌤️','🌇','🌙','📖','🏃','💧','🛏️','🪥',
               '🍽️','📝','🙏','✨','🎯','🧹','💪','🎨','📚','⭐'];
  function iconFor(i) { return ICONS[i % ICONS.length]; }

  /* ── Toggle (today only) ───────────────────────────────────────────── */
  async function toggleItem(id) {
    if (_viewDate !== _today) return;
    var card = document.getElementById('rc_' + id);
    if (card) card.style.opacity = '0.6';
    showSaving();
    try {
      var res  = await fetch(API_BASE + '/api/zehra-routine/toggle', {
        method: 'POST', headers: authHeaders(),
        body: JSON.stringify({ itemId: id, date: _today })
      });
      var data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed');
      _completions[_today] = data.completed;
      render();
      buildWeek();
      updateEarningsUI();
    } catch(ex) {
      alert('Could not save: ' + ex.message);
      if (card) card.style.opacity = '1';
    }
    hideSaving();
  }

  /* ── Add item ──────────────────────────────────────────────────────── */
  function toggleAddPanel() {
    var panel = document.getElementById('addPanel');
    panel.classList.toggle('open');
    if (panel.classList.contains('open')) document.getElementById('newItemText').focus();
  }

  async function addItem() {
    var text = document.getElementById('newItemText').value.trim();
    if (!text) { document.getElementById('newItemText').focus(); return; }
    var btn = document.getElementById('btnSaveItem');
    btn.disabled = true; btn.textContent = '…';
    showSaving();
    try {
      var res  = await fetch(API_BASE + '/api/zehra-routine/items', {
        method: 'POST', headers: authHeaders(),
        body: JSON.stringify({ text: text })
      });
      var data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed');
      _items.push(data.item);
      document.getElementById('newItemText').value = '';
      document.getElementById('addPanel').classList.remove('open');
      render();
    } catch(ex) { alert('Error: ' + ex.message); }
    btn.disabled = false; btn.textContent = 'Save';
    hideSaving();
  }

  /* ── Delete item ───────────────────────────────────────────────────── */
  async function deleteItem(id) {
    var item = _items.find(function(i) { return i.id === id; });
    if (!item || !confirm('Remove "' + item.text + '"?')) return;
    showSaving();
    try {
      var res  = await fetch(API_BASE + '/api/zehra-routine/items/' + id, {
        method: 'DELETE', headers: authHeaders()
      });
      var data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed');
      _items = _items.filter(function(i) { return i.id !== id; });
      render();
    } catch(ex) { alert('Error: ' + ex.message); }
    hideSaving();
  }

  /* ── History calendar ──────────────────────────────────────────────── */
  var _histYear  = new Date().getFullYear();
  var _histMonth = new Date().getMonth(); // 0-based
  var _histSelectedDate = null;

  var MONTH_NAMES = ['January','February','March','April','May','June',
                     'July','August','September','October','November','December'];

  function renderHistory() {
    if (!isAdmin) return;
    document.getElementById('historySection').style.display = '';
    buildHistCalendar();
  }

  function histPrevMonth() {
    _histMonth--;
    if (_histMonth < 0) { _histMonth = 11; _histYear--; }
    buildHistCalendar();
  }

  function histNextMonth() {
    _histMonth++;
    if (_histMonth > 11) { _histMonth = 0; _histYear++; }
    buildHistCalendar();
  }

  function buildHistCalendar() {
    document.getElementById('histMonthLabel').textContent = MONTH_NAMES[_histMonth] + ' ' + _histYear;

    var grid = document.getElementById('histCalGrid');
    var firstDay = new Date(_histYear, _histMonth, 1).getDay(); // 0=Sun
    var daysInMonth = new Date(_histYear, _histMonth + 1, 0).getDate();

    var html = '';
    // Leading blank cells
    for (var b = 0; b < firstDay; b++) {
      html += '<div class="hist-day"></div>';
    }

    for (var d = 1; d <= daysInMonth; d++) {
      var dateStr = _histYear + '-'
        + String(_histMonth + 1).padStart(2, '0') + '-'
        + String(d).padStart(2, '0');

      var completedIds = (_completions[dateStr] || []).map(Number);
      var total = _items.length;
      var done  = completedIds.length;
      var hasData = _completions[dateStr] !== undefined;
      var isToday = dateStr === _today;
      var isSelected = dateStr === _histSelectedDate;
      var isFuture = dateStr > _today;

      var cls = 'hist-day';
      if (hasData && !isFuture) {
        cls += ' has-data';
        if (total > 0 && done >= total)          cls += ' hist-full';
        else if (done > 0)                       cls += ' hist-partial';
        else                                     cls += ' hist-miss';
      }
      if (isToday)    cls += ' hist-today-cal';
      if (isSelected) cls += ' hist-selected';

      var dot = (hasData && !isFuture) ? '<div class="hist-day-dot"></div>' : '';
      var click = (!isFuture) ? 'onclick="showHistDay(\'' + dateStr + '\')"' : '';

      html += '<button class="' + cls + '" ' + click + '>'
            + '<span class="hist-day-num">' + d + '</span>'
            + dot
            + '</button>';
    }

    grid.innerHTML = html;

    // Render detail for currently selected date
    renderHistDetail();
  }

  function showHistDay(dateStr) {
    _histSelectedDate = dateStr;
    buildHistCalendar(); // rebuilds grid with new selection highlighted, then calls renderHistDetail
  }

  function renderHistDetail() {
    var el = document.getElementById('histDetail');
    if (!_histSelectedDate) { el.innerHTML = ''; return; }
    var dateStr = _histSelectedDate;
    var completedIds = (_completions[dateStr] || []).map(Number);
    var total = _items.length;
    var done  = completedIds.length;
    var isFull = total > 0 && done >= total;

    var dateObj = new Date(dateStr + 'T00:00:00');
    var label = dateObj.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long' });

    var rows = _items.map(function(item) {
      var isDone = completedIds.indexOf(Number(item.id)) !== -1;
      return '<div class="hist-detail-row">'
        + '<span class="hist-detail-icon ' + (isDone ? 'done' : 'miss') + '">' + (isDone ? '✓' : '✗') + '</span>'
        + '<span>' + esc(item.text) + '</span>'
        + '</div>';
    }).join('');

    var badge = '<span class="hist-detail-badge' + (isFull ? ' full' : '') + '">'
              + done + ' / ' + total + ' done</span>';

    el.innerHTML =
      '<div class="hist-detail">'
      + '<div class="hist-detail-hdr">'
      + '<span class="hist-detail-date">' + esc(label) + '</span>'
      + badge
      + '</div>'
      + '<div class="hist-detail-list">' + (rows || '<div class="hist-empty">No data</div>') + '</div>'
      + '</div>';
  }

  /* ── XSS ───────────────────────────────────────────────────────────── */
  function esc(str) {
    return String(str == null ? '' : str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  /* ── Midnight auto-reset ───────────────────────────────────────────── */
  setInterval(function() {
    var newToday = localDateStr();
    if (newToday !== _today) {
      _today    = newToday;
      _viewDate = newToday;
      updateViewHeader();
      buildWeek();
      render();
      renderHistory();
      finalizeUnprocessedDays();
    }
  }, 60000);

  /* ── Init ──────────────────────────────────────────────────────────── */
  if (isAdmin) {
    document.getElementById('btnAddFloat').style.display = 'flex';
    document.getElementById('btnResetEarn').style.display = 'flex';
  }

  updateViewHeader();

  (async function() {
    try {
      await fetchAll();
      buildWeek();
      render();
      renderHistory();
      updateEarningsUI();
      await finalizeUnprocessedDays();
    } catch(err) {
      document.getElementById('listWrap').innerHTML =
        '<div class="empty-card">Error loading: ' + esc(err.message) + '</div>';
    }
  })();
</script>
<script src="session-guard.js"></script>
</body>
</html>
