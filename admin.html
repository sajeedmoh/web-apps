<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel</title>
  <script>
    var _s = JSON.parse(localStorage.getItem('auth_session') || 'null');
    if (!_s) window.location.replace('login.html');
    if (_s && _s.role !== 'admin') window.location.replace('dashboard.html');
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #0f1117; --surface: #1a1d27; --surface2: #1f2330;
      --border:  rgba(255,255,255,0.08); --text: #f0f0f0;
      --muted:   rgba(240,240,240,0.45); --accent: #6366f1;
      --accent-bg: rgba(99,102,241,0.10); --accent-border: rgba(99,102,241,0.28);
      --green: #22c55e; --green-bg: rgba(34,197,94,0.10); --green-border: rgba(34,197,94,0.25);
      --red: #ef4444; --red-bg: rgba(239,68,68,0.08);
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
           background: var(--bg); color: var(--text); min-height: 100vh; padding: 76px 24px 60px; }

    .back-bar { position:fixed; top:0; left:0; right:0; z-index:100;
      background:rgba(15,17,23,0.92); backdrop-filter:blur(10px);
      border-bottom:1px solid var(--border); display:flex; align-items:center;
      padding:0 20px; height:44px; gap:12px; }
    .back-link { display:flex; align-items:center; gap:7px; font-size:0.82rem;
      color:var(--muted); text-decoration:none; transition:color .18s; }
    .back-link:hover { color:var(--accent); }

    .page-wrap { max-width: 860px; margin: 0 auto; }
    .page-title { font-size:1.75rem; font-weight:700; letter-spacing:-0.025em; margin-bottom:4px; }
    .page-sub   { font-size:0.85rem; color:var(--muted); margin-bottom:28px; }

    /* Section heading */
    .section-head { font-size:0.72rem; font-weight:600; letter-spacing:.1em;
      text-transform:uppercase; color:var(--muted); margin-bottom:12px; }

    /* User card */
    .user-card { background:var(--surface); border:1px solid var(--border);
      border-radius:14px; margin-bottom:12px; overflow:hidden; }
    .user-summary { display:flex; align-items:center; gap:14px; padding:16px 20px;
      cursor:pointer; user-select:none; transition:background .12s; }
    .user-summary:hover { background:var(--surface2); }
    .user-avatar { width:38px; height:38px; border-radius:50%; background:var(--accent-bg);
      border:1.5px solid var(--accent-border); display:flex; align-items:center;
      justify-content:center; font-size:0.9rem; font-weight:700; color:var(--accent);
      flex-shrink:0; text-transform:uppercase; }
    .user-info { flex:1; min-width:0; }
    .user-name  { font-size:0.92rem; font-weight:600; white-space:nowrap;
      overflow:hidden; text-overflow:ellipsis; }
    .user-email { font-size:0.78rem; color:var(--muted); white-space:nowrap;
      overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
    .user-role-badge { padding:3px 10px; border-radius:20px; font-size:0.7rem;
      font-weight:700; letter-spacing:.04em; flex-shrink:0; }
    .badge-admin { background:var(--accent-bg); color:var(--accent); border:1px solid var(--accent-border); }
    .badge-dev   { background:rgba(255,255,255,0.05); color:var(--muted); border:1px solid var(--border); }
    .chevron { color:var(--muted); transition:transform .2s; flex-shrink:0; }
    .user-card.open .chevron { transform:rotate(90deg); }

    /* Permissions panel */
    .perm-panel { border-top:1px solid var(--border); padding:18px 20px; display:none; }
    .user-card.open .perm-panel { display:block; }
    .perm-label { font-size:0.72rem; font-weight:600; letter-spacing:.08em;
      text-transform:uppercase; color:var(--muted); margin-bottom:14px; }
    .app-list { display:flex; flex-direction:column; gap:10px; }
    .app-row { display:flex; align-items:center; gap:14px; padding:10px 14px;
      background:rgba(255,255,255,0.02); border:1px solid var(--border);
      border-radius:10px; transition:border-color .15s; }
    .app-row.allowed { border-color:var(--green-border); background:var(--green-bg); }
    .app-icon { font-size:1.1rem; flex-shrink:0; }
    .app-name { flex:1; font-size:0.9rem; font-weight:500; }
    .app-url  { font-size:0.72rem; color:var(--muted); margin-top:2px; }

    /* Toggle switch */
    .toggle { position:relative; width:40px; height:22px; flex-shrink:0; }
    .toggle input { opacity:0; width:0; height:0; }
    .toggle-slider { position:absolute; inset:0; background:rgba(255,255,255,0.12);
      border-radius:22px; cursor:pointer; transition:background .2s; }
    .toggle-slider::before { content:''; position:absolute; width:16px; height:16px;
      left:3px; top:3px; background:#fff; border-radius:50%; transition:transform .2s; }
    .toggle input:checked + .toggle-slider { background:var(--green); }
    .toggle input:checked + .toggle-slider::before { transform:translateX(18px); }

    /* Admin full-access note */
    .full-access-note { font-size:0.82rem; color:var(--muted); font-style:italic; padding:6px 0; }

    /* Create user section */
    .create-card { background:var(--surface); border:1px solid var(--border);
      border-radius:14px; padding:20px; margin-bottom:28px; }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px; }
    .field label { display:block; font-size:0.78rem; color:var(--muted);
      margin-bottom:5px; font-weight:500; }
    .field input, .field select { width:100%; padding:10px 12px;
      background:rgba(255,255,255,0.04); border:1px solid var(--border);
      border-radius:9px; color:var(--text); font-size:0.9rem; font-family:inherit;
      outline:none; transition:border-color .15s; }
    .field input:focus, .field select:focus { border-color:var(--accent-border); }
    .field input::placeholder { color:rgba(240,240,240,0.2); }
    .field select option { background:#1a1d27; }
    .btn-primary { padding:10px 22px; background:var(--accent); border:none;
      border-radius:9px; color:#fff; font-size:0.88rem; font-weight:700;
      font-family:inherit; cursor:pointer; transition:filter .15s; }
    .btn-primary:hover { filter:brightness(1.12); }
    .btn-primary:disabled { opacity:0.6; cursor:not-allowed; }
    .btn-danger { padding:6px 14px; background:none; border:1px solid rgba(239,68,68,0.3);
      border-radius:7px; color:var(--red); font-size:0.78rem; font-family:inherit;
      cursor:pointer; transition:background .15s, border-color .15s; }
    .btn-danger:hover { background:var(--red-bg); border-color:var(--red); }

    .toast { position:fixed; bottom:24px; right:24px; z-index:999;
      background:#1f2330; border:1px solid var(--green-border); color:var(--green);
      padding:10px 18px; border-radius:10px; font-size:0.85rem; font-weight:600;
      opacity:0; transform:translateY(8px); transition:opacity .25s, transform .25s;
      pointer-events:none; }
    .toast.visible { opacity:1; transform:translateY(0); }

    @media (max-width:600px) {
      .form-grid { grid-template-columns:1fr; }
      body { padding:68px 14px 48px; }
    }
  </style>
</head>
<body>

<nav class="back-bar">
  <a href="dashboard.html" class="back-link">&#8592; Back to Dashboard</a>
</nav>

<div class="page-wrap">
  <h1 class="page-title">&#9881; Admin Panel</h1>
  <p class="page-sub">Manage users and control which apps each user can access.</p>

  <!-- Create user -->
  <div class="section-head">Create New User</div>
  <div class="create-card">
    <div class="form-grid">
      <div class="field"><label>First Name</label><input id="cfn" placeholder="e.g. Zehra" /></div>
      <div class="field"><label>Last Name</label><input id="cln" placeholder="e.g. Sajeed" /></div>
      <div class="field"><label>Email</label><input id="cem" type="email" placeholder="user@example.com" /></div>
      <div class="field"><label>Password</label><input id="cpw" type="password" placeholder="Temporary password" /></div>
    </div>
    <div style="display:flex;gap:10px;align-items:center">
      <button class="btn-primary" id="btnCreate" onclick="createUser()">Create User</button>
    </div>
  </div>

  <!-- Users list -->
  <div class="section-head">Users &amp; App Access</div>
  <div id="userList"><div style="color:var(--muted);font-size:.88rem">Loading…</div></div>
</div>

<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
  var _token = localStorage.getItem('auth_token');

  // Apps that are OFF by default (must be explicitly granted)
  var RESTRICTED_BY_DEFAULT = ['zehra-daily-routine'];

  var APPS = [
    { id: 'todo-list',              name: 'Todo List',              icon: '✅', url: 'todo-list.html'              },
    { id: 'prayer-times',           name: 'Prayer Times',           icon: '🕌', url: 'prayer-times.html'           },
    { id: 'rates-tracker',          name: 'Rates Tracker',          icon: '💱', url: 'rates-tracker.html'          },
    { id: 'electricity-calculator', name: 'Electricity Calculator', icon: '⚡', url: 'electricity-calculator.html' },
    { id: 'electricity-tracker',    name: 'Electricity Tracker',    icon: '📊', url: 'electricity-tracker.html'    },
    { id: 'funds',                  name: 'Funds Manager',          icon: '💰', url: 'funds.html'                  },
    { id: 'tripshare',              name: 'Trip Share',             icon: '✈️', url: 'tripshare.html'              },
    { id: 'zehra-daily-routine',    name: "Zehra's Daily Routine",  icon: '📋', url: 'zehra-daily-routine.html'    },
  ];

  function authHeaders() {
    return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + _token };
  }

  /* ── Toast ────────────────────────────────────────────────────────── */
  var _toastTimer = null;
  function showToast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('visible');
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(function() { el.classList.remove('visible'); }, 2200);
  }

  /* ── Load users ────────────────────────────────────────────────────── */
  var _users = [];

  async function loadUsers() {
    var res  = await fetch(API_BASE + '/api/admin/users', { headers: authHeaders() });
    var data = await res.json();
    if (!res.ok) { document.getElementById('userList').innerHTML = '<div style="color:var(--red)">Failed to load users.</div>'; return; }
    _users = data.users || [];
    renderUsers();
  }

  function renderUsers() {
    var wrap = document.getElementById('userList');
    if (_users.length === 0) { wrap.innerHTML = '<div style="color:var(--muted);font-size:.88rem">No users found.</div>'; return; }

    wrap.innerHTML = _users.map(function(u) {
      var initials = ((u.firstName || '')[0] || '') + ((u.lastName || '')[0] || '');
      var isAdmin  = u.role === 'admin';
      var perms    = Array.isArray(u.permissions) ? u.permissions : null; // null = no explicit config

      var appRows = isAdmin
        ? '<p class="full-access-note">Admin accounts have full access to all apps.</p>'
        : APPS.map(function(app) {
            // null permissions: regular apps ON, restricted apps OFF by default
            var allowed = perms !== null
              ? perms.indexOf(app.id) !== -1
              : RESTRICTED_BY_DEFAULT.indexOf(app.id) === -1;
            var rowKey = u.email.replace(/[@.]/g,'_');
            return '<div class="app-row' + (allowed ? ' allowed' : '') + '" id="row_' + rowKey + '_' + app.id + '">'
              + '<span class="app-icon">' + app.icon + '</span>'
              + '<div style="flex:1"><div class="app-name">' + esc(app.name) + '</div>'
              + '<div class="app-url">' + esc(app.url) + '</div></div>'
              + '<span id="ind_' + rowKey + '_' + app.id + '" style="font-size:0.72rem;min-width:52px;text-align:right"></span>'
              + '<label class="toggle"><input type="checkbox"' + (allowed ? ' checked' : '')
              + ' onchange="togglePerm(\'' + esc(u.email) + '\',\'' + app.id + '\',this.checked)" />'
              + '<span class="toggle-slider"></span></label>'
              + '</div>';
          }).join('');

      var delBtn = isAdmin ? '' : '<button class="btn-danger" onclick="deleteUser(\'' + esc(u.email) + '\')" style="margin-left:auto">Remove</button>';

      return '<div class="user-card" id="card_' + u.email.replace(/[@.]/g,'_') + '">'
        + '<div class="user-summary" onclick="toggleCard(\'' + u.email.replace(/[@.]/g,'_') + '\')">'
        + '<div class="user-avatar">' + esc(initials || '?') + '</div>'
        + '<div class="user-info"><div class="user-name">' + esc((u.firstName || '') + ' ' + (u.lastName || '')) + '</div>'
        + '<div class="user-email">' + esc(u.email) + '</div></div>'
        + '<span class="user-role-badge ' + (isAdmin ? 'badge-admin' : 'badge-dev') + '">' + (isAdmin ? 'Admin' : 'User') + '</span>'
        + delBtn
        + '<svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>'
        + '</div>'
        + '<div class="perm-panel"><div class="perm-label">App Permissions</div>'
        + '<div class="app-list">' + appRows + '</div></div>'
        + '</div>';
    }).join('');
  }

  /* ── Toggle card open/close ────────────────────────────────────────── */
  function toggleCard(key) {
    var card = document.getElementById('card_' + key);
    if (card) card.classList.toggle('open');
  }

  /* ── Toggle permission ─────────────────────────────────────────────── */
  async function togglePerm(email, appId, checked) {
    var user = _users.find(function(u) { return u.email === email; });
    if (!user) return;

    var key = email.replace(/[@.]/g, '_');
    var row = document.getElementById('row_' + key + '_' + appId);
    var ind = document.getElementById('ind_' + key + '_' + appId);

    // Show saving state
    if (ind) { ind.textContent = 'Saving…'; ind.style.color = 'var(--muted)'; }

    // Build current permissions array — handle undefined/null both as "all apps"
    var currentPerms = Array.isArray(user.permissions)
      ? user.permissions.slice()
      : APPS.map(function(a) { return a.id; });

    if (checked) {
      if (currentPerms.indexOf(appId) === -1) currentPerms.push(appId);
    } else {
      currentPerms = currentPerms.filter(function(id) { return id !== appId; });
    }

    try {
      var res = await fetch(API_BASE + '/api/admin/users/' + encodeURIComponent(email) + '/permissions', {
        method: 'PUT', headers: authHeaders(), body: JSON.stringify({ permissions: currentPerms })
      });
      var data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed');

      user.permissions = currentPerms;
      if (row) row.classList.toggle('allowed', checked);
      if (ind) { ind.textContent = 'Saved ✓'; ind.style.color = 'var(--green)'; }
      setTimeout(function() { if (ind) ind.textContent = ''; }, 2000);
    } catch(ex) {
      if (ind) { ind.textContent = 'Failed ✗'; ind.style.color = 'var(--red)'; }
      setTimeout(function() { if (ind) ind.textContent = ''; }, 2500);
      alert('Error saving permissions: ' + ex.message);
      await loadUsers();
    }
  }

  /* ── Create user ───────────────────────────────────────────────────── */
  async function createUser() {
    var fn = document.getElementById('cfn').value.trim();
    var ln = document.getElementById('cln').value.trim();
    var em = document.getElementById('cem').value.trim();
    var pw = document.getElementById('cpw').value;
    if (!fn || !ln || !em || !pw) { alert('All fields are required.'); return; }
    var btn = document.getElementById('btnCreate');
    btn.disabled = true; btn.textContent = 'Creating…';
    try {
      var res  = await fetch(API_BASE + '/api/admin/users', {
        method: 'POST', headers: authHeaders(),
        body: JSON.stringify({ firstName: fn, lastName: ln, email: em, password: pw, role: 'user' })
      });
      var data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed');
      document.getElementById('cfn').value = '';
      document.getElementById('cln').value = '';
      document.getElementById('cem').value = '';
      document.getElementById('cpw').value = '';
      showToast('✓ User created');
      await loadUsers();
    } catch(ex) { alert('Error: ' + ex.message); }
    btn.disabled = false; btn.textContent = 'Create User';
  }

  /* ── Delete user ───────────────────────────────────────────────────── */
  async function deleteUser(email) {
    if (!confirm('Delete user ' + email + '? This cannot be undone.')) return;
    try {
      var res  = await fetch(API_BASE + '/api/admin/users/' + encodeURIComponent(email), {
        method: 'DELETE', headers: authHeaders()
      });
      var data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed');
      showToast('✓ User removed');
      await loadUsers();
    } catch(ex) { alert('Error: ' + ex.message); }
  }

  /* ── XSS ───────────────────────────────────────────────────────────── */
  function esc(str) {
    return String(str == null ? '' : str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  loadUsers();
</script>
<script src="session-guard.js"></script>
</body>
</html>
